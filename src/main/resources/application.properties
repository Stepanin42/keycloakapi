quarkus.keycloak.devservices.realm-path=quarkus-realm.json
quarkus.keycloak.devservices.port=8180

quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=service
quarkus.oidc.tls.verification=none
keycloak.realm=quarkus

quarkus.rest-client.keycloak-token-api.url=http://localhost:8180
quarkus.rest-client.keycloak-admin-api.url=http://localhost:8180

mp.openapi.extensions.security-schemes.bearerAuth.type=http
mp.openapi.extensions.security-schemes.bearerAuth.scheme=bearer
mp.openapi.extensions.security-schemes.bearerAuth.bearerFormat=JWT

quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth

quarkus.http.auth.permission.public.paths=/auth/register,/auth/token,/q/swagger-ui/*,/q/openapi
quarkus.http.auth.permission.public.policy=permit


quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

keycloak.admin.client-id=user-registration-service
keycloak.admin.client-secret=secret

#Лимиты для авторизации
quarkus.rate-limiter.buckets.auth.limits[0].permitted-uses=5
quarkus.rate-limiter.buckets.auth.limits[0].period=1M

#Лимиты на эндпоинты с авторизацией
quarkus.rate-limiter.buckets.api.limits[0].permitted-uses=50
quarkus.rate-limiter.buckets.api.limits[0].period=1M